[project]
name = "ec20-voice-steer"
version = "0.0.1"
description = "Test whether a ceiling microphone array can steer an Epiphan EC20 with VISCA over IP preset recalls"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["epiphan", "ec20", "ptz", "visca", "visca-over-ip", "dante", "voice-tracking", "pearl-mini"]
classifiers = [
    "Private :: Do Not Upload",
    "License :: OSI Approved :: Apache Software License",
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
authors = [{ name = "Tim Kipper", email = "tkipper@epiphan.com" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.16.0",
]

[project.optional-dependencies]
mic = ["numpy>=2", "sounddevice>=0.5"]

[project.scripts]
ec20-steer = "ec20_voice_steer.cli:main"

[project.urls]
Source = "https://github.com/ScientiaCapital/ec20-voice-steer"
Issues = "https://github.com/ScientiaCapital/ec20-voice-steer/issues"

[build-system]
requires = ["uv_build>=0.9.26,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_readme_art.py" = ["E501"]  # inline SVG templates

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
